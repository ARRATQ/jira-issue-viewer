services:
  db:
    image: postgres:16-alpine
    container_name: jiv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jira_issue_viewer}
      POSTGRES_USER: ${DB_USER:-jivuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - jiv-db-data:/var/lib/postgresql/data
    networks:
      - jiv-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-jivuser} -d ${DB_NAME:-jira_issue_viewer}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: jiv-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL n'est pas assemblée ici : certaines plateformes (ex.
      # Coolify) exposent chaque entrée de `environment:` comme une
      # variable éditable dans leur UI et ne résolvent pas correctement
      # cette interpolation composée (plusieurs `${...}` dans une seule
      # valeur), ce qui corrompt la chaîne de connexion. Elle est donc
      # construite dans entrypoint.sh avec un vrai shell, à partir des
      # variables simples ci-dessous.
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-jira_issue_viewer}
      - DB_USER=${DB_USER:-jivuser}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_PAT=${JIRA_PAT:-}
      - JIRA_JQL=${JIRA_JQL:-}
      - JIRA_TLS_REJECT_UNAUTHORIZED=${JIRA_TLS_REJECT_UNAUTHORIZED:-false}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8070}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrateur}
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - jiv-net
    ports:
      - '${BACKEND_PORT:-3001}:3001'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ''
    container_name: jiv-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - jiv-net
    ports:
      - '${APP_PORT:-8070}:80'

volumes:
  jiv-db-data:

networks:
  jiv-net:
    driver: bridge
