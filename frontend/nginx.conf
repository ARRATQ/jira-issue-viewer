server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers statiques buildés par Vite : cache long, noms hashés.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API : relayée vers le backend Express du réseau Docker Compose.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Réponses potentiellement volumineuses (pièces jointes).
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # SPA : toute route non-fichier retombe sur index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
