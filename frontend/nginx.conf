server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS embarqué de Docker : ré-résolu à chaque requête (via la variable
    # ci-dessous) plutôt qu'une seule fois au démarrage de nginx. Sans ça, un
    # redémarrage du conteneur backend (nouvelle IP interne) laisserait nginx
    # bloqué sur l'ancienne IP jusqu'à son propre redémarrage.
    resolver 127.0.0.11 valid=10s;

    # Fichiers statiques buildés par Vite : cache long, noms hashés.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API : relayée vers le backend Express du réseau Docker Compose.
    location /api/ {
        # Avec une variable dans proxy_pass, nginx ne réécrit plus l'URI à
        # partir du préfixe de location : il faut donc reconstruire le
        # chemin complet explicitement via $request_uri.
        set $backend_upstream backend:3001;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Réponses potentiellement volumineuses (pièces jointes).
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # SPA : toute route non-fichier retombe sur index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
